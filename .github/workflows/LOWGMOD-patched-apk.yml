name: Patch LOWGMOD APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget openjdk-17-jdk
          wget -O apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.3.1/apktool.jar"
          chmod +x apktool.jar
          export PATH="$PATH:$(pwd)"

      - name: Download APK
        run: |
          mkdir -p downloads
          curl -L -o downloads/LOWGMOD-8.2.104.apk "https://www.mediafire.com/file/6n4k9hmvjalsche/LOWGMOD-ANDROID-8.2.104.apk/file?dkey=d7lvli4phy1&r=916"

      - name: Decompile
        run: java -jar apktool.jar d downloads/LOWGMOD-8.2.104.apk -o decompiled

      - name: Patch smali
        run: find decompiled -name "*.smali" -exec sed -i "s|https://key.tsclowgmod.com|https://disabled-mod.example.com|g" {} \;

      - name: Patch native lib
        run: sed -i "s|https://key.tsclowgmod.com|https://disabled-mod.example.com|g" decompiled/lib/arm64-v8a/liblowgmod.so

      - name: Rebuild
        run: java -jar apktool.jar b decompiled -o downloads/patched-unsigned.apk

      - name: Sign
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storetype PKCS12 -validity 9999 -dname "cn=Android" -keyalg RSA -keysize 2048 -storepass android -keypass android > /dev/null 2>&1 || true
          apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out downloads/patched-signed.apk downloads/patched-unsigned.apk

      - name: Zip align
        run: sudo apt-get install -y zipalign && zipalign -f -v 4 downloads/patched-signed.apk downloads/LOWGMOD-patched-final.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: downloads/LOWGMOD-patched-final.apk